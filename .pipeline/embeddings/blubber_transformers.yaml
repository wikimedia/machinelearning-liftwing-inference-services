# syntax=docker-registry.wikimedia.org/repos/releng/blubber/buildkit:v1.0.1
version: v4
# SentenceTransformer backend for Jina embeddings. Reuses the amd-vllm022 base
# because Jina v5 needs torch>=2.8 + flash-attn: this image ships torch 2.10.0
# and flash-attn 2.8.3 (gfx90a+gfx942) prebuilt. vLLM is bundled in the base but
# is NEVER invoked — the server (model_transformers.py) imports only
# sentence_transformers/torch, and the entrypoint runs that module directly.
base: docker-registry.wikimedia.org/ml/amd-vllm022:gfx90agfx942rocm7.2.0pytorch2.10.0flash-attn2.8.3aiter0.1.13vllm0.22.1-3
runs:
  insecurely: true
  environment:
    # amd-vllm022 ships a py3.12 venv at /srv/venv; install there instead of
    # blubber's default /opt/lib/venv (which would be the wrong python version).
    PYTHONPATH: /srv/venv/lib/python3.12/site-packages:/srv/app
    PATH: $PATH:/srv/app
    # Overwrite proxy variables with empty strings
    http_proxy:
    https_proxy:
    no_proxy:

lives:
  in: /srv/app

variants:
  build:
    apt:
      packages:
        - build-essential
        - cmake
        - git
        - pkg-config
    builders:
      - custom:
          # install into the base image's py3.12 venv, not blubber's default venv.
          # transformers>=5.1 upgrades the base's bundled transformers (vLLM 0.22.1
          # pins transformers<5); harmless here since vLLM is never imported.
          requirements: [src/models/embeddings/requirements_transformers.txt]
          command: ["/srv/venv/bin/python", "-m", "pip", "install", "-r", "src/models/embeddings/requirements_transformers.txt"]
      - custom:
          requirements: [python/requirements.txt]
          command: ["/srv/venv/bin/python", "-m", "pip", "install", "-r", "python/requirements.txt"]


  production:
    copies:
      - from: local
        source: src/models/embeddings/.
        destination: .
      - from: local
        source: python
        destination: python
      - from: build
        source: /srv/venv/lib/python3.12/site-packages
        destination: /srv/venv/lib/python3.12/site-packages
      - from: local
        source: model_server_entrypoint_python312.sh
        destination: entrypoint.sh
      - from: local
        source: common_settings_python312.sh
        destination: common_settings.sh

    apt:
      packages:
        - wmf-certificates
        - libdrm-amdgpu1
        - g++
    entrypoint: ["./entrypoint.sh", "model_server/model_transformers.py"]
