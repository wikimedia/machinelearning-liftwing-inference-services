# syntax=docker-registry.wikimedia.org/repos/releng/blubber/buildkit:v1.5.1
version: v4
base: docker-registry.wikimedia.org/bookworm:20260906
runs:
  insecurely: true
  environment:
    PYTHONPATH: /srv/tool_server:/srv/tool_server/src/models/tool_server:/opt/lib/venv/lib/python3.11/site-packages

lives:
  in: /srv/tool_server

variants:
  build:
    apt:
      packages:
        - build-essential
        - python3-pip
        - python3-dev
        - python3-setuptools
        - python3-venv
    builders:
      - python:
          version: python3
          requirements: ["src/models/tool_server/requirements.txt"]

  production:
    copies:
      - from: local
        source: src/models/tool_server/.
        destination: .
      - from: build
        source: /opt/lib/venv/lib/python3.11/site-packages
        destination: /opt/lib/venv/lib/python3.11/site-packages
    apt:
      packages:
        - python3
        - python3-distutils
        - python3-setuptools
        - python3-venv
        - wmf-certificates
    python:
      version: python3
      use-system-site-packages: false
    entrypoint: ["./entrypoint.sh"]

  test:
    copies:
      - from: build
        source: /opt/lib/venv/lib/python3.11/site-packages
        destination: /opt/lib/venv/lib/python3.11/site-packages
      - from: local
        source: src/models/tool_server
        destination: src/models/tool_server/
      - from: local
        source: test/unit/__init__.py
        destination: test/unit/__init__.py
      - from: local
        source: test/unit/tool_server
        destination: test/unit/tool_server/
      - from: local
        source: requirements-test.txt
        destination: .
      - from: local
        source: tox.ini
        destination: .
      - from: local
        source: ruff.toml
        destination: .
      - from: local
        source: .pre-commit-config.yaml
        destination: .
      - from: local
        source: ci_entrypoint.sh
        destination: entrypoint.sh
    apt:
      packages:
        - python3
        - python3-distutils
        - python3-setuptools
        - python3-venv
        - wmf-certificates
        - git
    python:
      version: python3
      use-system-site-packages: false
      requirements: [requirements-test.txt]
    entrypoint: ["./entrypoint.sh", "ci-lint", "ci-unit"]
